services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_PASSWORD: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 10

    mongo:
        image: mongo:7
        ports:
            - "27017:27017"
        volumes:
            - mongo-data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    rabbitmq:
        image: rabbitmq:4-management
        # RabbitMQ stores its data per node name, which comes from the hostname; pin it so the volume is reused.
        hostname: rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: autowise
            RABBITMQ_DEFAULT_PASS: autowise123
        ports:
            # Host port 5673 matches the services' local user secrets (amqp://...@localhost:5673/).
            # Containers use rabbitmq:5672.
            - "5673:5672"
            - "15672:15672"   # management UI: http://localhost:15672
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 10s
            retries: 10

    keycloak:
        image: quay.io/keycloak/keycloak:26.4
        # Imports Keycloak/autowise-realm.json on first start (skipped once the realm exists).
        command: start-dev --import-realm
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin
            # Tokens are always issued as localhost:8080 (what the browser sees), while containers
            # such as the gateway can still reach Keycloak's endpoints at keycloak:8080.
            KC_HOSTNAME: http://localhost:8080
            KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
        ports:
            - "8080:8080"
        volumes:
            - keycloak-data:/opt/keycloak/data
            - ./Keycloak:/opt/keycloak/data/import:ro

    media:
        build:
            context: ./Backend
            dockerfile: AutoWise.Media/AutoWise.Media.API/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=media;Username=postgres;Password=postgres"
            ConnectionStrings__RabbitMQ: "amqp://autowise:autowise123@rabbitmq:5672/"
            Storage__ActiveProvider: LocalDisk
            Storage__LocalDisk__RootPath: /data/media
        ports:
            - "7037:8080"
        volumes:
            - media-files:/data/media
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

    vehicles-catalog:
        build:
            context: ./Backend
            dockerfile: AutoWise.VehiclesCatalog/AutoWise.VehiclesCatalog.API/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__MongoDb: "mongodb://mongo:27017/AutoWise"
            ConnectionStrings__Redis: "redis:6379"
            VinDecoderSpecifications__ApiKey: "YOUR-VIN-DECODER-API-KEY"
            VinDecoderSpecifications__SecretKey: "YOUR-VIN-DECODER-SECRET-KEY"
            Kestrel__EndpointDefaults__Protocols: Http1AndHttp2
        ports:
            - "4040:8080"
        depends_on:
            mongo:
                condition: service_healthy
            redis:
                condition: service_healthy

    user-vehicles:
        build:
            context: ./Backend
            dockerfile: AutoWise.UserVehicles/AutoWise.UserVehicles.API/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=uservehicles;Username=postgres;Password=postgres"
            ConnectionStrings__RabbitMQ: "amqp://autowise:autowise123@rabbitmq:5672/"
            ConnectionStrings__Redis: "redis:6379"
            GrpcSettings__VehiclesCatalogUrl: "http://vehicles-catalog:8080"
            DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT: "1"
        ports:
            - "7279:8080"
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
            vehicles-catalog:
                condition: service_started

    users:
        build:
            context: ./Backend
            dockerfile: AutoWise.Users/AutoWise.Users.API/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=users;Username=postgres;Password=postgres"
            Kestrel__EndpointDefaults__Protocols: Http1AndHttp2
        ports:
            - "7126:8080"
        depends_on:
            postgres:
                condition: service_healthy

    gateway:
        build:
            context: ./Backend
            dockerfile: AutoWise.YarpApiGateway/AutoWise.YarpApiGateway/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: Docker
            ConnectionStrings__Redis: "redis:6379"
            GrpcSettings__UsersUrl: "http://users:8080"
            DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT: "1"
            Auth__ActiveProvider: Keycloak
            Auth__Keycloak__Authority: "http://localhost:8080/realms/autowise"
            Auth__Keycloak__MetadataAddress: "http://keycloak:8080/realms/autowise/.well-known/openid-configuration"
            Auth__Keycloak__Audience: autowise-api
            Auth__AzureAD__Authority: "YOUR-AZURE-AD-AUTHORITY"
            Auth__AzureAD__Audience: "YOUR-AZURE-AD-AUDIENCE"
        ports:
            - "7080:8080"
        depends_on:
            redis:
                condition: service_healthy
            keycloak:
                condition: service_started
            users:
                condition: service_started
            user-vehicles:
                condition: service_started
            vehicles-catalog:
                condition: service_started
            media:
                condition: service_started

volumes:
    postgres-data:
    mongo-data:
    media-files:
    keycloak-data:
    redis-data:
    rabbitmq-data: