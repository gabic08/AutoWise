services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_PASSWORD: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data

    mongo:
        image: mongo:7
        ports:
            - "27017:27017"
        volumes:
            - mongo-data:/data/db

    redis:
        image: redis:7
        ports:
            - "6379:6379"
    
    rabbitmq:
        image: rabbitmq:4-management
        environment:
            RABBITMQ_DEFAULT_USER: autowise
            RABBITMQ_DEFAULT_PASS: autowise123
        ports:
            - "5672:5672"
            - "15672:15672"

    media:
        build:
            context: ./Backend
            dockerfile: AutoWise.Media/AutoWise.Media.API/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=media;Username=postgres;Password=postgres"
            ConnectionStrings__RabbitMQ: "amqp://autowise:autowise123@rabbitmq:5672/"
            Storage__ActiveProvider: LocalDisk
            Storage__LocalDisk__RootPath: /data/media
        ports:
            - "7037:8080"
        volumes:
            - media-files:/data/media
        depends_on:
            - postgres
            - rabbitmq

    vehicles-catalog:
        build:
            context: ./Backend
            dockerfile: AutoWise.VehiclesCatalog/AutoWise.VehiclesCatalog.API/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__MongoDb: "mongodb://mongo:27017/AutoWise"
            ConnectionStrings__Redis: "redis:6379"
            VinDecoderSpecifications__ApiKey: "YOUR-VIN-DECODER-API-KEY"
            VinDecoderSpecifications__SecretKey: "YOUR-VIN-DECODER-SECRET-KEY"
            Kestrel__EndpointDefaults__Protocols: Http1AndHttp2
        ports:
            - "4040:8080"
        depends_on:
            - mongo
            - redis

    user-vehicles:
        build:
            context: ./Backend
            dockerfile: AutoWise.UserVehicles/AutoWise.UserVehicles.API/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=uservehicles;Username=postgres;Password=postgres"
            ConnectionStrings__RabbitMQ: "amqp://autowise:autowise123@rabbitmq:5672/"
            ConnectionStrings__Redis: "redis:6379"
            GrpcSettings__VehiclesCatalogUrl: "http://vehicles-catalog:8080"
            DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT: "1"
        ports:
            - "7279:8080"
        depends_on:
            - postgres
            - rabbitmq
            - redis
            - vehicles-catalog

    users:
        build:
            context: ./Backend
            dockerfile: AutoWise.Users/AutoWise.Users.API/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=users;Username=postgres;Password=postgres"
            Kestrel__EndpointDefaults__Protocols: Http1AndHttp2
        ports:
            - "7126:8080"
        depends_on:
            - postgres

    gateway:
        build:
            context: ./Backend
            dockerfile: AutoWise.YarpApiGateway/AutoWise.YarpApiGateway/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: Docker
            ConnectionStrings__Redis: "redis:6379"
            GrpcSettings__UsersUrl: "http://users:8080"
            DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT: "1"
            Auth__AzureAD__Authority: "YOUR-AZURE-AD-AUTHORITY"
            Auth__AzureAD__Audience: "YOUR-AZURE-AD-AUDIENCE"
        ports:
            - "7080:8080"
        depends_on:
            - redis
            - users
            - user-vehicles
            - vehicles-catalog
            - media

volumes:
    postgres-data:
    mongo-data:
    media-files: